name: checkmate_crew
description: "Checkmate Crew – a chess app built by our team in Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  chess: ^0.8.1
  simple_chess_board: ^1.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/branding/
    - assets/sounds/